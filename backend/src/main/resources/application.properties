spring.application.name=backend
server.port=${PORT:8080}

spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS}


spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO}
spring.jpa.show-sql=true
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

app.cors.allowed-origins=${ALLOWED_ORIGINS}
app.auth.refresh-cookie.secure=${REFRESH_COOKIE_SECURE}
app.auth.refresh-cookie.same-site=${REFRESH_COOKIE_SAME_SITE}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.ssl.enabled=${REDIS_SSL}

google.oauth.client-id=${GOOGLE_CLIENT_ID}
google.oauth.client-secret=${GOOGLE_CLIENT_SECRET}
google.oauth.redirect-uri=${GOOGLE_REDIRECT_URI}
google.oauth.state-ttl-seconds=${GOOGLE_OAUTH_STATE_TTL_SECONDS}
google.oauth.encryption-key=${GOOGLE_OAUTH_ENCRYPTION_KEY}
google.oauth.frontend-result-uri=${GOOGLE_OAUTH_FRONTEND_RESULT_URI}

github.oauth.client-id=${GITHUB_CLIENT_ID}
github.oauth.client-secret=${GITHUB_CLIENT_SECRET}
github.oauth.redirect-uri=${GITHUB_REDIRECT_URI}
github.oauth.state-ttl-seconds=${GITHUB_OAUTH_STATE_TTL_SECONDS}
github.oauth.encryption-key=${GITHUB_OAUTH_ENCRYPTION_KEY}
github.oauth.frontend-result-uri=${GITHUB_OAUTH_FRONTEND_RESULT_URI:${GOOGLE_OAUTH_FRONTEND_RESULT_URI}}

app.invite.validity-days=${INVITE_VALIDITY_DAYS}
app.invite.frontend-url=${INVITES_URL}

aws.region=${AWS_REGION}
aws.s3.bucket=${AWS_S3_BUCKET}

janus.base-url=${JANUS_BASE_URL}
janus.admin-key=${JANUS_ADMIN_KEY}
janus.room-secret=${JANUS_ROOM_SECRET}
janus.room-pin=${JANUS_ROOM_PIN}

recaptcha.secret-key=${RECAPTCHA_SECRET_KEY}
recaptcha.min-score=${RECAPTCHA_MIN_SCORE}
recaptcha.allowed-domain=${RECAPTCHA_ALLOWED_DOMAIN}
recaptcha.enabled=${RECAPTCHA_ENABLED}

clamav.host=${CLAMAV_HOST}
clamav.port=${CLAMAV_PORT}
clamav.enabled=${CLAMAV_ENABLED}

server.address=0.0.0.0

gemini.api-key=${GEMINI_API_KEY:${GOOGLE_API_KEY}}
gemini.chat-model=${GEMINI_CHAT_MODEL:gemini-3.8-flash}
gemini.embedding-model=${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}

spring.ai.google.genai.api-key=${gemini.api-key}
spring.ai.google.genai.chat.options.model=${gemini.chat-model}
spring.ai.google.genai.embedding.api-key=${gemini.api-key}
spring.ai.google.genai.embedding.text.options.model=${gemini.embedding-model}
spring.ai.google.genai.embedding.text.options.dimensions=1536
