name: Deploy FrietSync Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e

            cd /home/ubuntu/FrietSync
            git fetch origin main
            git reset --hard origin/main

            cd backend

            echo "Validating Docker Compose..."
            sudo docker compose config --quiet

            echo "Building backend..."
            sudo docker compose build backend

            echo "Starting PostgreSQL and Redis..."
            sudo docker compose up -d postgres redis

            echo "Starting Spring Boot..."
            sudo docker compose up -d backend

            echo "Cleaning old images..."
            sudo docker image prune -f

            echo "Connecting Janus to Docker network..."
            if ! sudo docker inspect janus --format '{{json .NetworkSettings.Networks}}' | grep -q '"frietsync-network"'; then
              sudo docker network connect frietsync-network janus
            fi

            echo "Checking API health..."
            for attempt in $(seq 1 60); do
              if curl --fail --silent http://localhost:8080/api/v1/check >/dev/null; then
                echo "Deployment successful!"
                sudo docker compose ps
                exit 0
              fi
              sleep 2
            done

            echo "Deployment failed. Backend logs:"
            sudo docker compose logs --tail=150 backend
            exit 1