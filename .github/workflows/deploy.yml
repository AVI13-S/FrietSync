name: Deploy FrietSync

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/FrietSync
            git pull origin main
            cd backend
            bash mvnw clean package -DskipTests
            sudo systemctl restart frietsync
            sudo systemctl is-active --quiet frietsync